{% extends "base.html" %}
{% block title %}Interview Simulator — Virender AI Hub{% endblock %}

{% block content %}

<section class="interview-layout">

  <!-- LEFT PANEL -->
  <aside class="interview-sidebar glass">
    <h2 class="neon-text">⚡ Interview Setup</h2>

    <label>Role</label>
    <select id="role" class="input">
      <option>Backend Engineer</option>
      <option>Frontend Engineer</option>
      <option>Full-Stack Engineer</option>
      <option>AI / ML Engineer</option>
      <option>Data Scientist</option>
      <option>DevOps / Platform Engineer</option>
      <option>Product Manager</option>
      <option>Javascript</option>
      <option>Typescript</option>
      <option>React js</option>
      <option>Next js</option>
      <option>Node js</option>
      <option>Python</option>
      <option>GraphQL</option>
      <option>Microservices</option>
      <option>Mysql</option>
      <option>MongoDB</option>
      <option>Open Search</option>
      <option>Vector Database</option>
      <option>AWS</option>
      <option>Azure</option>
      <option>GCP</option>
      <option>AWS Lambda</option>
      <option>AWS S3</option>
      <option>AWS RDS</option>
      <option>AWS EC2</option>
      <option>AWS EBS</option>
      <option>AWS EFS</option>
      <option>Docker</option>
      <option>Kubernetes</option>
      <option>CI/CD</option>
      <option>Git</option>
      <option>RAG</option>
      <option>LangGraph</option>
      <option>Agentic AI</option>
      <option>System Design</option>
    </select>

    <label>Difficulty</label>
    <select id="difficulty" class="input">
      <option>Junior</option>
      <option>Mid-level</option>
      <option>Senior</option>
      <option>Expert</option>
      <option>Staff / Principal</option>
    </select>

    <label>Number of Questions</label>
    <input type="number" id="num" value="3" class="input"/>

    <button class="btn-primary" onclick="startInterview()">
      ▶ Start Interview
    </button>

  </aside>


  <!-- RIGHT PANEL -->
  <div class="interview-chat glass">

    <div class="chat-header">
      💬 Interview Session
    </div>

    <div class="chat-box" id="chat"></div>

    <div class="chat-input">
      <textarea id="answer" placeholder="Type your answer..."></textarea>
      <button onclick="submitAnswer()">Submit →</button>
    </div>

  </div>

</section>

{% endblock %}

{% block scripts %}
<script>

let questionCount = 1;

async function startInterview() {
    const res = await fetch("/api/interview/start", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            role: document.getElementById("role").value,
            difficulty: document.getElementById("difficulty").value,
            num_questions: document.getElementById("num").value
        })
    });

    const data = await res.json();

    const chat = document.getElementById("chat");
    chat.innerHTML = "";
    questionCount = 1;

    addQuestion(data.state.current_question);
}

async function submitAnswer() {
    const answerText = document.getElementById("answer").value;
    if (!answerText) return;

    addAnswer(answerText);

    const res = await fetch("/api/interview/answer", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({answer: answerText})
    });

    const data = await res.json();

    const formattedFeedback = formatFeedback(data.state.feedback);

    addFeedback(formattedFeedback);

    if (data.state.active) {
        addQuestion(data.state.current_question);
    } else {
        addFeedback("🎉 Interview Completed!");
    }

    document.getElementById("answer").value = "";
}

function formatFeedback(text) {
    if (!text) return "";

    // Remove extra spacing
    text = text.replace(/\n\s*\n+/g, "\n");

    // =========================
    // ✅ CODE BLOCKS ```
    // =========================
    text = text.replace(
        /```(\w+)?\n([\s\S]*?)```/g,
        (match, lang, code) => {
            return `
<pre class="code-block">
<code class="language-${lang || ""}">
${escapeHtml(code)}
</code>
</pre>`;
        }
    );

    // =========================
    // ✅ HEADINGS (#, ##, ###)
    // Works even without space
    // ###Heading
    // =========================
    text = text
        .replace(/^###\s*(.+)$/gm, "<h3>$1</h3>")
        .replace(/^##\s*(.+)$/gm, "<h2>$1</h2>")
        .replace(/^#\s*(.+)$/gm, "<h1>$1</h1>");

    // =========================
    // ✅ BOLD TEXT (*text*, **text**, ****text***)
    // Handles uneven stars
    // =========================
    text = text.replace(/\*{1,}([^*]+?)\*{1,}/g, "<strong>$1</strong>");

    // =========================
    // ✅ NUMBERED LISTS
    // =========================
    text = text.replace(/^\d+\.\s(.+)/gm, "<li>$1</li>");
    text = text.replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>");

    // =========================
    // ✅ LINE BREAKS
    // =========================
    text = text.replace(/\n/g, "<br>");

    return text;
}

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function addQuestion(q) {
    const chat = document.getElementById("chat");

    chat.innerHTML += `
        <div class="msg question">
            <b>Question ${questionCount++}</b><br>${q}
        </div>
    `;
}

function addAnswer(a) {
    const chat = document.getElementById("chat");

    chat.innerHTML += `
        <div class="msg answer">${a}</div>
    `;
}

function addFeedback(f) {
    const chat = document.getElementById("chat");

    chat.innerHTML += `
        <div class="msg feedback">${f}</div>
    `;
}

</script>
{% endblock %}
