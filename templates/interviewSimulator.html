{% extends "base.html" %}
{% block title %}Interview Simulator — Virender AI Hub{% endblock %}

{% block content %}

<section class="interview-layout">

  <!-- LEFT PANEL -->
  <aside class="interview-sidebar glass">
    <h2 class="neon-text">⚡ Interview Setup</h2>

    <label>Role</label>
    <select id="role" class="input">
      <option>Backend Engineer</option>
      <option>Frontend Engineer</option>
      <option>Full-Stack Engineer</option>
      <option>AI / ML Engineer</option>
      <option>Data Scientist</option>
      <option>DevOps / Platform Engineer</option>
      <option>Product Manager</option>
      <option>Javascript</option>
      <option>Typescript</option>
      <option>React js</option>
      <option>Next js</option>
      <option>Node js</option>
      <option>Python</option>
      <option>GraphQL</option>
      <option>Microservices</option>
      <option>Mysql</option>
      <option>MongoDB</option>
      <option>Open Search</option>
      <option>Vector Database</option>
      <option>AWS</option>
      <option>Azure</option>
      <option>GCP</option>
      <option>AWS Lambda</option>
      <option>AWS S3</option>
      <option>AWS RDS</option>
      <option>AWS EC2</option>
      <option>AWS EBS</option>
      <option>AWS EFS</option>
      <option>Docker</option>
      <option>Kubernetes</option>
      <option>CI/CD</option>
      <option>Git</option>
      <option>RAG</option>
      <option>LangGraph</option>
      <option>Agentic AI</option>
      <option>System Design</option>
    </select>

    <label>Difficulty</label>
    <select id="difficulty" class="input">
      <option>Junior</option>
      <option>Mid-level</option>
      <option>Senior</option>
      <option>Expert</option>
      <option>Staff / Principal</option>
    </select>

    <label>Number of Questions</label>
    <input type="number" id="num" value="3" class="input"/>

    <label class="interview-tts-label">
      <input type="checkbox" id="readAloud" checked />
      Read questions aloud (HF TTS)
    </label>

    <label for="ttsModel">TTS engine</label>
    <select id="ttsModel" class="input" title="Hugging Face Inference via fal-ai">
      <option value="ResembleAI/chatterbox">Chatterbox</option>
      <option value="hexgrad/Kokoro-82M">Kokoro 82M</option>
    </select>

    <label for="ttsVoice">Voice (model)</label>
    <select id="ttsVoice" class="input">
      <option value="">Random</option>
    </select>

    <label for="browserSystemVoice">Browser voice (fallback)</label>
    <select id="browserSystemVoice" class="input" title="Used when HF TTS fails or when you click Browser voice">
      <option value="">Default (OS picks)</option>
    </select>

    <p id="ttsTokenHint" class="tts-env-hint" hidden></p>

    <button class="btn-primary" onclick="startInterview()">
      ▶ Start Interview
    </button>

  </aside>


  <!-- RIGHT PANEL -->
  <div class="interview-chat glass">

    <div class="chat-header">
      💬 Interview Session
    </div>

    <div class="chat-box" id="chat"></div>

    <div class="chat-input">
      <textarea id="answer" placeholder="Type your answer..."></textarea>
      <button onclick="submitAnswer()">Submit →</button>
    </div>

  </div>

</section>

{% endblock %}

{% block scripts %}
<script>

let questionCount = 1;
let _ttsOptions = null;

function readAloudEnabled() {
    const el = document.getElementById("readAloud");
    return el && el.checked;
}

async function ensureTtsOptions() {
    if (_ttsOptions) return _ttsOptions;
    const res = await fetch("/api/interview/tts/options", { cache: "no-store" });
    if (!res.ok) return null;
    _ttsOptions = await res.json();
    return _ttsOptions;
}

function saveTtsPrefs() {
    const m = document.getElementById("ttsModel");
    const v = document.getElementById("ttsVoice");
    if (m && m.value) localStorage.setItem("interviewTtsModel", m.value);
    if (v) localStorage.setItem("interviewTtsVoice", v.value);
}

function applyVoicesForModel(modelId) {
    const voiceSel = document.getElementById("ttsVoice");
    if (!_ttsOptions || !voiceSel) return;
    const spec = _ttsOptions.models.find((x) => x.id === modelId) || _ttsOptions.models[0];
    const saved = localStorage.getItem("interviewTtsVoice");
    voiceSel.innerHTML = "";
    for (const vo of spec.voices || []) {
        const opt = document.createElement("option");
        opt.value = vo.id;
        opt.textContent = vo.label;
        voiceSel.appendChild(opt);
    }
    const defV =
        (_ttsOptions.defaultVoiceByModel && _ttsOptions.defaultVoiceByModel[modelId]) ||
        (voiceSel.options[0] && voiceSel.options[0].value) ||
        "";
    const ok = [...voiceSel.options].some((o) => o.value === saved);
    voiceSel.value = ok ? saved : defV;
}

function fillBrowserSystemVoiceSelect() {
    const sel = document.getElementById("browserSystemVoice");
    if (!sel || !window.speechSynthesis) return;
    const saved = localStorage.getItem("interviewBrowserVoiceUri") || "";
    const voices = window.speechSynthesis.getVoices().slice();
    voices.sort((a, b) => {
        const la = (a.lang || "").toLowerCase();
        const lb = (b.lang || "").toLowerCase();
        if (la !== lb) return la.localeCompare(lb);
        return (a.name || "").localeCompare(b.name || "");
    });
    sel.innerHTML = '<option value="">Default (OS picks)</option>';
    for (const v of voices) {
        const opt = document.createElement("option");
        opt.value = v.voiceURI;
        opt.textContent = `${v.name} (${v.lang || "?"})`;
        sel.appendChild(opt);
    }
    if (saved && [...sel.options].some((o) => o.value === saved)) {
        sel.value = saved;
    }
}

function setupBrowserSystemVoiceSelect() {
    const sel = document.getElementById("browserSystemVoice");
    if (!sel || sel.dataset.bound === "1") return;
    sel.dataset.bound = "1";
    sel.addEventListener("change", () => {
        localStorage.setItem("interviewBrowserVoiceUri", sel.value);
    });
    if (window.speechSynthesis) {
        window.speechSynthesis.addEventListener("voiceschanged", fillBrowserSystemVoiceSelect);
    }
    fillBrowserSystemVoiceSelect();
    setTimeout(fillBrowserSystemVoiceSelect, 400);
}

function getSelectedSystemVoice() {
    const sel = document.getElementById("browserSystemVoice");
    if (!sel || !sel.value || !window.speechSynthesis) return null;
    return window.speechSynthesis.getVoices().find((v) => v.voiceURI === sel.value) || null;
}

async function initInterviewTtsUi() {
    const modelSel = document.getElementById("ttsModel");
    const voiceSel = document.getElementById("ttsVoice");
    if (!modelSel || !voiceSel) return;
    const opts = await ensureTtsOptions();
    if (!opts || !opts.models || !opts.models.length) return;
    const hint = document.getElementById("ttsTokenHint");
    if (hint && opts.hf_token_configured === false) {
        hint.hidden = false;
        hint.textContent =
            "HF token missing on server: add HF_TOKEN or HUGGING_FACE_HUB_TOKEN to .env, restart Flask. Model voices only work after that.";
    } else if (hint) {
        hint.hidden = true;
        hint.textContent = "";
    }
    modelSel.innerHTML = "";
    for (const m of opts.models) {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = m.label;
        if (m.hint) opt.title = m.hint;
        modelSel.appendChild(opt);
    }
    const savedM = localStorage.getItem("interviewTtsModel") || opts.defaultModel;
    modelSel.value = [...modelSel.options].some((o) => o.value === savedM)
        ? savedM
        : opts.defaultModel;
    applyVoicesForModel(modelSel.value);
    modelSel.addEventListener("change", () => {
        applyVoicesForModel(modelSel.value);
        saveTtsPrefs();
    });
    voiceSel.addEventListener("change", saveTtsPrefs);
    setupBrowserSystemVoiceSelect();
}

function ttsRequestPayload(text) {
    const modelEl = document.getElementById("ttsModel");
    const voiceEl = document.getElementById("ttsVoice");
    const model = (modelEl && modelEl.value) || "ResembleAI/chatterbox";
    const voice = voiceEl ? voiceEl.value : "";
    return { text, model, voice };
}

function plainTextForSpeech(raw) {
    if (!raw) return "";
    let s = String(raw);
    s = s.replace(/<[^>]*>/g, " ");
    s = s.replace(/\*{1,2}([^*]+)\*{1,2}/g, "$1");
    s = s.replace(/\s+/g, " ").trim();
    return s.slice(0, 5000);
}

function speakWithBrowser(text) {
    const plain = plainTextForSpeech(text);
    if (!plain || !window.speechSynthesis) return false;
    try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(plain);
        const v = getSelectedSystemVoice();
        if (v) u.voice = v;
        u.rate = 0.9;
        u.volume = 1;
        u.pitch = 1;
        window.speechSynthesis.speak(u);
        return true;
    } catch (_) {
        return false;
    }
}

function appendBrowserVoiceNotice(questionEl, reason) {
    if (questionEl.querySelector("[data-tts-browser-notice]")) return;
    questionEl.insertAdjacentHTML(
        "beforeend",
        `<div class="tts-hint tts-hint--browser" data-tts-browser-notice="1">${escapeHtml(reason)}</div>`
    );
}

function appendBrowserVoiceButton(questionEl, text) {
    if (!questionEl || questionEl.querySelector("[data-tts-browser-btn]")) return;
    const broBtn = document.createElement("button");
    broBtn.type = "button";
    broBtn.setAttribute("data-tts-browser-btn", "1");
    broBtn.className = "tts-browser-btn";
    broBtn.textContent = "Browser voice";
    broBtn.title =
        "Reads this question with your system text-to-speech. Click if the clip is silent, will not play, or you hear nothing.";
    if (!window.speechSynthesis) {
        broBtn.disabled = true;
        broBtn.title = "Speech synthesis is not available in this browser.";
    }
    broBtn.onclick = () => {
        const a = questionEl.querySelector("audio.interview-tts-audio");
        if (a) {
            try {
                a.pause();
            } catch (_) {}
        }
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }
        speakWithBrowser(text);
    };
    questionEl.appendChild(broBtn);
}

/**
 * Loads TTS for this question and appends an <audio controls> bar.
 * If the model clip cannot play or the API fails, falls back to the browser Speech Synthesis API so you still hear the question.
 */
async function attachQuestionAudio(questionEl, text) {
    if (!readAloudEnabled() || !text || !questionEl) return;
    let browserSpoke = false;
    function tryBrowserVoice(reason) {
        if (browserSpoke) return;
        if (speakWithBrowser(text)) {
            browserSpoke = true;
            appendBrowserVoiceNotice(questionEl, reason);
        }
    }
    try {
        const res = await fetch("/api/interview/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(ttsRequestPayload(text)),
            cache: "no-store",
        });
        if (!res.ok) {
            let detail = `HTTP ${res.status}`;
            try {
                const err = await res.json();
                if (err && err.error) detail = err.error;
            } catch (_) { /* not JSON */ }
            questionEl.insertAdjacentHTML(
                "beforeend",
                `<div class="tts-hint tts-hint--err">Question audio: ${escapeHtml(detail)}</div>`
            );
            tryBrowserVoice("Model voice unavailable; using browser text-to-speech instead.");
            return;
        }
        const mime = (res.headers.get("Content-Type") || "audio/wav").split(";")[0].trim();
        const buf = await res.arrayBuffer();
        if (!buf.byteLength) {
            questionEl.insertAdjacentHTML(
                "beforeend",
                `<div class="tts-hint tts-hint--err">Question audio: empty response</div>`
            );
            tryBrowserVoice("No audio data; using browser text-to-speech instead.");
            return;
        }
        const blob = new Blob([buf], { type: mime });
        const url = URL.createObjectURL(blob);
        const audio = document.createElement("audio");
        audio.className = "interview-tts-audio";
        audio.controls = true;
        audio.preload = "auto";
        audio.volume = 1;
        audio.src = url;
        audio.addEventListener("ended", () => URL.revokeObjectURL(url), { once: true });
        audio.addEventListener("error", () => {
            const err = audio.error;
            const detail = err ? `MediaError code ${err.code}` : "decode/load failed";
            tryBrowserVoice(`Model clip could not play (${detail}). Using browser text-to-speech instead.`);
        });
        questionEl.appendChild(audio);
        try {
            await audio.play();
        } catch (_) {
            /* Autoplay blocked — use the on-screen play button, or press Play on the page */
        }
    } catch (e) {
        questionEl.insertAdjacentHTML(
            "beforeend",
            `<div class="tts-hint tts-hint--err">Question audio: ${escapeHtml(String(e && e.message ? e.message : e))}</div>`
        );
        tryBrowserVoice("Network error; using browser text-to-speech instead.");
    } finally {
        appendBrowserVoiceButton(questionEl, text);
    }
}

async function startInterview() {
    const res = await fetch("/api/interview/start", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            role: document.getElementById("role").value,
            difficulty: document.getElementById("difficulty").value,
            num_questions: document.getElementById("num").value
        })
    });

    const data = await res.json();

    const chat = document.getElementById("chat");
    chat.innerHTML = "";
    questionCount = 1;

    const q = data.state.current_question;
    const qEl = addQuestion(q);
    await attachQuestionAudio(qEl, q);
}

async function submitAnswer() {
    const answerText = document.getElementById("answer").value;
    if (!answerText) return;

    addAnswer(answerText);

    const res = await fetch("/api/interview/answer", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({answer: answerText})
    });

    const data = await res.json();

    const formattedFeedback = formatFeedback(data.state.feedback);

    addFeedback(formattedFeedback);

    if (data.state.active) {
        const q = data.state.current_question;
        const qEl = addQuestion(q);
        await attachQuestionAudio(qEl, q);
    } else {
        addFeedback("🎉 Interview Completed!");
    }

    document.getElementById("answer").value = "";
}

function formatFeedback(text) {
    if (!text) return "";

    // Remove extra spacing
    text = text.replace(/\n\s*\n+/g, "\n");

    // =========================
    // ✅ CODE BLOCKS ```
    // =========================
    text = text.replace(
        /```(\w+)?\n([\s\S]*?)```/g,
        (match, lang, code) => {
            return `
<pre class="code-block">
<code class="language-${lang || ""}">
${escapeHtml(code)}
</code>
</pre>`;
        }
    );

    // =========================
    // ✅ HEADINGS (#, ##, ###)
    // Works even without space
    // ###Heading
    // =========================
    text = text
        .replace(/^###\s*(.+)$/gm, "<h3>$1</h3>")
        .replace(/^##\s*(.+)$/gm, "<h2>$1</h2>")
        .replace(/^#\s*(.+)$/gm, "<h1>$1</h1>");

    // =========================
    // ✅ BOLD TEXT (*text*, **text**, ****text***)
    // Handles uneven stars
    // =========================
    text = text.replace(/\*{1,}([^*]+?)\*{1,}/g, "<strong>$1</strong>");

    // =========================
    // ✅ NUMBERED LISTS
    // =========================
    text = text.replace(/^\d+\.\s(.+)/gm, "<li>$1</li>");
    text = text.replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>");

    // =========================
    // ✅ LINE BREAKS
    // =========================
    text = text.replace(/\n/g, "<br>");

    return text;
}

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function addQuestion(q) {
    const chat = document.getElementById("chat");
    const wrap = document.createElement("div");
    wrap.className = "msg question";
    wrap.innerHTML = `<b>Question ${questionCount++}</b><br>${q}`;
    chat.appendChild(wrap);
    return wrap;
}

function addAnswer(a) {
    const chat = document.getElementById("chat");

    chat.innerHTML += `
        <div class="msg answer">${a}</div>
    `;
}

function addFeedback(f) {
    const chat = document.getElementById("chat");

    chat.innerHTML += `
        <div class="msg feedback">${f}</div>
    `;
}

document.addEventListener("DOMContentLoaded", () => {
    initInterviewTtsUi().catch(() => {});
});
</script>
{% endblock %}
