# Stock Finder screening universe (stock_finder/data/market_data.py).
# Sector -> liquid large/mid caps. The screener and peer comparison only look inside
# this list, which keeps data fetches bounded and avoids penny / illiquid stocks.
# Symbols use the provider's ticker format (yfinance: ".NS" = NSE, ".BO" = BSE).
# Edit freely; the sector names are what the screener maps market themes to.

