# Implied-skills map for the match score (jobEngine/matching/fit_score.py).
#
# A skill the candidate profile demonstrates covers its core sub-topics: a job that
# asks for "SSR" is satisfied by Next.js experience, "Context API" by React.
# A job requirement naming one of these sub-topics counts as "met" whatever the
# LLM said — the map, not the LLM, decides what counts as implied. Extend it as
# needed; scores are recomputed with the new map on the next run (no new LLM call).
#
# Each entry:
#   aliases — how the skill can appear in Profile/Summary.txt (any one present = candidate has it)
#   implies — sub-topics it covers, matched as whole words/phrases (case-insensitive)
#
# Keep "implies" to things that genuinely come with the parent skill. A separate
# tool (e.g. Redux, Kubernetes) does not belong here.

next.js:
  aliases: [next.js, nextjs, next js]
  implies:
    - ssr
    - server-side rendering
    - server side rendering
    - ssg
    - static site generation
    - csr
    - client-side rendering
    - client side rendering
    - isr
    - incremental static regeneration
    - app router
    - pages router
    - api routes
    - file-based routing
    - react server components
    - server components
    - image optimization

react:
  aliases: [react, react.js, reactjs]
  implies:
    - jsx
    - hooks
    - react hooks
    - context api
    - reusable components
    - functional components
    - component-based architecture
    - virtual dom
    - spa
    - single page application
    - single-page application

