# Job source configuration for the AI Job Discovery & Matching Engine.
#
# Add a new source by adding one entry here + implementing/registering its
# adapter (see docs/job_engine/SOURCE_ADAPTER_GUIDE.md) — the LangGraph
# builder creates the corresponding node dynamically. No core graph changes.
#
# Fields:
#   id                — unique lowercase slug, used as the state key / node name root
#   adapter           — registered adapter name (jobEngine/sources/registry.py)
#   graph_node        — optional; defaults to "<id>_job_node"
#   requires_auth     — if true, the adapter must gracefully degrade (SourceError) when
#                       no authenticated session is configured; no credential automation,
#                       no CAPTCHA/anti-bot bypass is implemented anywhere in this engine.
#   allowed_domains   — SSRF allowlist; auto-derived from base_url/search_urls if omitted
#   selectors         — optional overrides consumed by the "generic" adapter (CSS selectors)
#   title_keywords    — optional; jobs whose title has none of these words are dropped
#                       before their details are opened (whole words; "full-stack" also
#                       matches "Full Stack"/"Fullstack"). Lowercase keywords are matched
#                       case-insensitively; a keyword with capitals (e.g. AI) is matched
#                       exactly as written. Empty = keep all.
#   title_exclude_keywords — optional; jobs whose title has any of these words are dropped
#                       the same way (same matching; "java" never matches "JavaScript").
#   max_jobs/max_pages — hard caps enforced by guardrails, independent of what the site offers

job_sources:
  - id: linkedin
    name: LinkedIn
    enabled: true
    base_url: "https://www.linkedin.com"
    search_urls:
      - "https://www.linkedin.com/jobs/search-results/?currentJobId=4484829035&keywords=Full%20Stack%20Developer%20OR%20Full%20Stack%20Engineer%20OR%20AI%20Engineer%20OR%20Generative%20AI%20Engineer%20OR%20Software%20Engineer%20OR%20Backend%20Engineer&origin=JOB_SEARCH_PAGE_LOCATION_AUTOCOMPLETE&referralSearchId=8gh5iteTxtzVQcCCyie%2BJA%3D%3D&geoId=102713980&f_TPR=r86400"
      # - "https://www.linkedin.com/jobs/search-results/?currentJobId=4362132219&keywords=Full%20Stack%20Developer%20OR%20Full%20Stack%20Engineer%20OR%20AI%20Engineer%20OR%20Generative%20AI%20Engineer%20OR%20Software%20Engineer%20OR%20Backend%20Engineer&origin=JOB_SEARCH_PAGE_LOCATION_HISTORY&referralSearchId=cPaVqFNJtgXcoyDG2k2FPg%3D%3D&geoId=100205264&f_TPR=r86400"
      # - "https://www.linkedin.com/jobs/search-results/?currentJobId=4486024839&keywords=Full%20Stack%20Developer%20OR%20Full%20Stack%20Engineer%20OR%20AI%20Engineer%20OR%20Generative%20AI%20Engineer%20OR%20Software%20Engineer%20OR%20Backend%20Engineer&origin=JOB_SEARCH_PAGE_LOCATION_AUTOCOMPLETE&referralSearchId=rvZL4DP%2Fy2Q5WkuT%2Frbrog%3D%3D&geoId=102454443&f_TPR=r86400"
    adapter: linkedin
    signin_url: "https://www.linkedin.com/login/?trk=guest_homepage-basic_nav-header-signin"
    allowed_domains: ["linkedin.com", "licdn.com"]
    graph_node: linkedin_job_node
    requires_auth: true
    browser_profile: default
    timeout_seconds: 300
    max_jobs: 400
    max_pages: 20
    rate_limit_delay_seconds: 2.0
    title_keywords: [
      software, engineer, developer, AI, lead, fullstack,
    ]
    # Dropped before their details are opened, so never sent to the LLM.
    title_exclude_keywords: [
      java, intern, internship, c#, .net, dotnet, asp.net, go, golang, manager,
    ]
    notes: >
      Reuses the saved Playwright session (cookies) from the MongoDB browser_sessions
      collection. If it is missing or expired, signs in at signin_url with
      LINKEDIN_EMAIL / LINKEDIN_PASSWORD and saves a fresh session to MongoDB.
      No CAPTCHA/anti-bot bypass: a security checkpoint must be completed by hand
      (JOB_BROWSER_HEADLESS=true), otherwise the source reports a SourceError.

  - id: instinctools
    name: Instinctools
    enabled: true
    base_url: "https://www.instinctools.eu"
    search_urls:
      - "https://www.instinctools.eu/vacancies/"
    adapter: instinctools
    graph_node: instinctools_job_node
    requires_auth: false
    browser_profile: default
    timeout_seconds: 60
    max_jobs: 100
    max_pages: 5
    rate_limit_delay_seconds: 1.0
    # Dropped before their details are opened, so never sent to the LLM.
    title_exclude_keywords: [
      java, intern, internship, c#, .net, dotnet, asp.net, go, golang, manager,
    ]
    notes: >
      Public vacancies listing, no login required. Selectors are best-effort and may need
      verification/updates if Instinctools changes their markup (see
      docs/job_engine/SOURCE_ADAPTER_GUIDE.md "Known limitations").

