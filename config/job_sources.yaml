# Job source configuration for the AI Job Discovery & Matching Engine.
#
# Add a new source by adding one entry here + implementing/registering its
# adapter (see docs/job_engine/SOURCE_ADAPTER_GUIDE.md) — the LangGraph
# builder creates the corresponding node dynamically. No core graph changes.
#
# Fields:
#   id                — unique lowercase slug, used as the state key / node name root
#   adapter           — registered adapter name (jobEngine/sources/registry.py)
#   graph_node        — optional; defaults to "<id>_job_node"
#   requires_auth     — if true, the adapter must gracefully degrade (SourceError) when
#                       no authenticated session is configured; no credential automation,
#                       no CAPTCHA/anti-bot bypass is implemented anywhere in this engine.
#   allowed_domains   — SSRF allowlist; auto-derived from base_url/search_urls if omitted
#   selectors         — optional overrides consumed by the "generic" adapter (CSS selectors)
#   title_keywords    — optional; jobs whose title has none of these words are dropped
#                       before their details are opened (whole words; "full-stack" also
#                       matches "Full Stack"/"Fullstack"). Lowercase keywords are matched
#                       case-insensitively; a keyword with capitals (e.g. AI) is matched
#                       exactly as written. Empty = keep all.
#   title_exclude_keywords — optional; jobs whose title has any of these words are dropped
#                       the same way (same matching; "java" never matches "JavaScript").
#   max_posted_age_hours — optional; once every results page is read, jobs listed as older
#                       than this ("11 hours ago") are stored as rejected (skipped by later
#                       runs) and never fetched. A card with no visible age ("Viewed") is
#                       checked with the age its fetched details show. LinkedIn only for now.
#   sort_newest_first — optional (LinkedIn); adds sortBy=DD to the search URL and stops
#                       paginating after a page where every card was already saved/rejected
#                       by an earlier run, is older than max_posted_age_hours, or is excluded.
#   max_jobs/max_pages — hard caps enforced by guardrails, independent of what the site offers

job_sources:
  - id: linkedin
    name: LinkedIn
    enabled: true
    base_url: "https://www.linkedin.com"
    search_urls:
      - "https://www.linkedin.com/jobs/search-results/?currentJobId=4491667591&keywords=Full%20Stack%20Developer%20OR%20Full%20Stack%20Engineer%20OR%20AI%20Engineer%20OR%20Generative%20AI%20Engineer%20OR%20Software%20Engineer%20OR%20Backend%20Engineer&origin=JOB_SEARCH_PAGE_LOCATION_AUTOCOMPLETE&referralSearchId=IBUXZ%2F9egmLsGQwHFNet%2Bg%3D%3D&geoId=106204383&f_TPR=r86400&f_SAL=f_SA_id_226001%3A272015"
      - "https://www.linkedin.com/jobs/search-results/?currentJobId=4492406068&keywords=Full%20Stack%20Developer%20OR%20Full%20Stack%20Engineer%20OR%20AI%20Engineer%20OR%20Generative%20AI%20Engineer%20OR%20Software%20Engineer%20OR%20Backend%20Engineer&origin=JOB_SEARCH_PAGE_LOCATION_AUTOCOMPLETE&referralSearchId=IBUXZ%2F9egmLsGQwHFNet%2Bg%3D%3D&geoId=102454443&f_TPR=r86400&f_SAL=f_SA_id_226001%3A272015"
      - "https://www.linkedin.com/jobs/search-results/?currentJobId=4492120996&keywords=Full%20Stack%20Developer%20OR%20Full%20Stack%20Engineer%20OR%20AI%20Engineer%20OR%20Generative%20AI%20Engineer%20OR%20Software%20Engineer%20OR%20Backend%20Engineer&origin=JOB_SEARCH_PAGE_JOB_FILTER&referralSearchId=IBUXZ%2F9egmLsGQwHFNet%2Bg%3D%3D&geoId=106693272&f_TPR=r86400&f_SAL=f_SA_id_226001%3A272015"
      - "https://www.linkedin.com/jobs/search-results/?currentJobId=4492267924&keywords=Full%20Stack%20Developer%20OR%20Full%20Stack%20Engineer%20OR%20AI%20Engineer%20OR%20Generative%20AI%20Engineer%20OR%20Software%20Engineer%20OR%20Backend%20Engineer&origin=JOB_SEARCH_PAGE_LOCATION_AUTOCOMPLETE&referralSearchId=OKKWr4dJ8aZlEFhelKQtLw%3D%3D&geoId=101165590&f_TPR=r86400&f_SAL=f_SA_id_225001%3A272001%24f_SA_id_226001%3A272015"
      - "https://www.linkedin.com/jobs/search-results/?currentJobId=4492120993&keywords=Full%20Stack%20Developer%20OR%20Full%20Stack%20Engineer%20OR%20AI%20Engineer%20OR%20Generative%20AI%20Engineer%20OR%20Software%20Engineer%20OR%20Backend%20Engineer&origin=JOB_SEARCH_PAGE_LOCATION_AUTOCOMPLETE&referralSearchId=OKKWr4dJ8aZlEFhelKQtLw%3D%3D&geoId=102890719&f_TPR=r86400&f_SAL=f_SA_id_225001%3A272001%24f_SA_id_226001%3A272015"
      - "https://www.linkedin.com/jobs/search-results/?currentJobId=4492132385&keywords=Full%20Stack%20Developer%20OR%20Full%20Stack%20Engineer%20OR%20AI%20Engineer%20OR%20Generative%20AI%20Engineer%20OR%20Software%20Engineer%20OR%20Backend%20Engineer&origin=JOB_SEARCH_PAGE_LOCATION_AUTOCOMPLETE&referralSearchId=OKKWr4dJ8aZlEFhelKQtLw%3D%3D&geoId=104738515&f_TPR=r86400&f_SAL=f_SA_id_225001%3A272001%24f_SA_id_226001%3A272015"
      - "https://www.linkedin.com/jobs/search-results/?currentJobId=4491387045&keywords=Full%20Stack%20Developer%20OR%20Full%20Stack%20Engineer%20OR%20AI%20Engineer%20OR%20Generative%20AI%20Engineer%20OR%20Software%20Engineer%20OR%20Backend%20Engineer&origin=JOB_SEARCH_PAGE_LOCATION_AUTOCOMPLETE&referralSearchId=dNFeJiwF0So9glOE89p1qQ%3D%3D&geoId=105117694&f_TPR=r86400&f_SAL=f_SA_id_225001%3A272001%24f_SA_id_226001%3A272015"
      - "https://www.linkedin.com/jobs/search-results/?currentJobId=4488680961&keywords=Full%20Stack%20Developer%20OR%20Full%20Stack%20Engineer%20OR%20AI%20Engineer%20OR%20Generative%20AI%20Engineer%20OR%20Software%20Engineer%20OR%20Backend%20Engineer&origin=JOB_SEARCH_PAGE_LOCATION_AUTOCOMPLETE&referralSearchId=dNFeJiwF0So9glOE89p1qQ%3D%3D&geoId=100456013&f_TPR=r86400&f_SAL=f_SA_id_225001%3A272001%24f_SA_id_226001%3A272015"
      - "https://www.linkedin.com/jobs/search-results/?currentJobId=4469672881&keywords=Full%20Stack%20Developer%20OR%20Full%20Stack%20Engineer%20OR%20AI%20Engineer%20OR%20Generative%20AI%20Engineer%20OR%20Software%20Engineer%20OR%20Backend%20Engineer&origin=JOB_SEARCH_PAGE_LOCATION_AUTOCOMPLETE&referralSearchId=dNFeJiwF0So9glOE89p1qQ%3D%3D&geoId=103819153&f_TPR=r86400&f_SAL=f_SA_id_225001%3A272001%24f_SA_id_226001%3A272015"
      - "https://www.linkedin.com/jobs/search-results/?currentJobId=4467962131&keywords=Full%20Stack%20Developer%20OR%20Full%20Stack%20Engineer%20OR%20AI%20Engineer%20OR%20Generative%20AI%20Engineer%20OR%20Software%20Engineer%20OR%20Backend%20Engineer&origin=JOB_SEARCH_PAGE_LOCATION_AUTOCOMPLETE&referralSearchId=dNFeJiwF0So9glOE89p1qQ%3D%3D&geoId=105490917&f_TPR=r86400&f_SAL=f_SA_id_225001%3A272001%24f_SA_id_226001%3A272015"
    adapter: linkedin
    signin_url: "https://www.linkedin.com/login/?trk=guest_homepage-basic_nav-header-signin"
    allowed_domains: ["linkedin.com", "licdn.com"]
    graph_node: linkedin_job_node
    requires_auth: true
    browser_profile: default
    timeout_seconds: 300
    max_jobs: 400
    max_pages: 20
    rate_limit_delay_seconds: 2.0
    # LinkedIn's minimum "Date posted" filter is 24h (f_TPR=r86400); only jobs whose
    # card/pane age is within this many hours are kept. No title_keywords allow-list.
    max_posted_age_hours: 10
    # Adds sortBy=DD (newest first) and stops after the first page with nothing new.
    sort_newest_first: true
    # Dropped before their details are opened, so never sent to the LLM.
    title_exclude_keywords: [
      java, intern, internship, c#, .net, dotnet, asp.net, go, golang, manager,
    ]
    notes: >
      Reuses the saved Playwright session (cookies) from the MongoDB browser_sessions
      collection. If it is missing or expired, signs in at signin_url with
      LINKEDIN_EMAIL / LINKEDIN_PASSWORD and saves a fresh session to MongoDB.
      No CAPTCHA/anti-bot bypass: a security checkpoint must be completed by hand
      (JOB_BROWSER_HEADLESS=true), otherwise the source reports a SourceError.

  - id: instinctools
    name: Instinctools
    enabled: true
    base_url: "https://www.instinctools.eu"
    search_urls:
      - "https://www.instinctools.eu/vacancies/"
    adapter: instinctools
    graph_node: instinctools_job_node
    requires_auth: false
    browser_profile: default
    timeout_seconds: 60
    max_jobs: 100
    max_pages: 5
    rate_limit_delay_seconds: 1.0
    # Dropped before their details are opened, so never sent to the LLM.
    title_exclude_keywords: [
      java, intern, internship, c#, .net, dotnet, asp.net, go, golang, manager,
    ]
    notes: >
      Public vacancies listing, no login required. Selectors are best-effort and may need
      verification/updates if Instinctools changes their markup (see
      docs/job_engine/SOURCE_ADAPTER_GUIDE.md "Known limitations").

